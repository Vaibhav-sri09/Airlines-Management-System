<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrivals - AeroDB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>AeroDB</h1>
            <p>Airport Management System</p>
        </div>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="arrivals.html" class="active">Arrivals</a>
            <a href="departures.html">Departures</a>
            <a href="jetfuel.html">Jet Fuel</a>
            <a href="maintenance.html">Runway</a>
            <a href="passengers.html">Passengers</a>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h2>Add New Arrival Flight</h2>
            <form id="arrivals-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="arr-flight-no">Flight Number</label>
                        <input type="text" id="arr-flight-no" name="flight_no" required>
                    </div>

                    <div class="form-group">
                        <label for="arr-airline">Airline Name</label>
                        <input type="text" id="arr-airline" name="airlines" required>
                    </div>

                    <div class="form-group">
                        <label for="arr-origin">Origin City</label>
                        <input type="text" id="arr-origin" name="origin" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="arr-time">Arrival Time (YYYY-MM-DD HH:MM:SS)</label>
                        <input type="text" id="arr-time" name="a_time" required>
                    </div>

                    <div class="form-group">
                        <label for="arr-gate">Gate</label>
                        <input type="text" id="arr-gate" name="gate" required>
                    </div>

                    <div class="form-group">
                        <label for="arr-status">Status</label>
                        <select id="arr-status" name="status">
                            <option value="On Time">On Time</option>
                            <option value="Delayed">Delayed</option>
                            <option value="Landed">Landed</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Add Arrival Record</button>
            </form>
        </section>

        <section class="card">
            <h2>Arrival Flights Schedule</h2>
            <table id="arrivals-table">
                <thead>
                    <tr>
                        <th>Flight No</th>
                        <th>Airline</th>
                        <th>Origin</th>
                        <th>Arrival Time</th>
                        <th>Gate</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
