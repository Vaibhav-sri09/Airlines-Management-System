<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jet Fuel - AeroDB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>AeroDB</h1>
            <p>Airport Management System</p>
        </div>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="arrivals.html">Arrivals</a>
            <a href="departures.html">Departures</a>
            <a href="jetfuel.html" class="active">Jet Fuel</a>
            <a href="maintenance.html">Runway</a>
            <a href="passengers.html">Passengers</a>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h2>Log Aircraft Refueling</h2>
            <form id="jetfuel-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="fuel-id">Fuel ID</label>
                        <input type="text" id="fuel-id" required>
                    </div>

                    <div class="form-group">
                        <label for="fuel-flight-no">Flight Number</label>
                        <input type="text" id="fuel-flight-no" name="flight_no" required>
                    </div>

                    <div class="form-group">
                        <label for="fuel-date">Fueling Time (YYYY-MM-DD HH:MM:SS)</label>
                        <input type="text" id="fuel-date" name="fueling_time" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fuel-qty">Fuel Quantity (Litres)</label>
                        <input type="number" id="fuel-qty" name="fuel_quantity" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="fuel-price">Price Per Litre (₹)</label>
                        <input type="number" id="fuel-price" name="price" step="0.01" min="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="fuel-total">Total Cost (₹)</label>
                        <input type="text" id="fuel-total" name="total" readonly>
                    </div>
                </div>

                <div class="calc-box">
                    Live Total Cost: <strong id="fuel-calc-preview">₹ 0.00</strong>
                </div>

                <button type="submit" class="btn-primary">Log Fuel Record</button>
            </form>
        </section>

        <section class="card">
            <h2>Refueling Logs</h2>
            <table id="jetfuel-table">
                <thead>
                    <tr>
                        <th>Fuel ID</th>
                        <th>Flight No</th>
                        <th>Quantity (L)</th>
                        <th>Price/Litre</th>
                        <th>Total Cost</th>
                        <th>Date &amp; Time</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
