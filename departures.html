<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departures - AeroDB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>AeroDB</h1>
            <p>Airport Management System</p>
        </div>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="arrivals.html">Arrivals</a>
            <a href="departures.html" class="active">Departures</a>
            <a href="jetfuel.html">Jet Fuel</a>
            <a href="maintenance.html">Runway</a>
            <a href="passengers.html">Passengers</a>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h2>Add New Departure Flight</h2>
            <form id="departures-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="dep-flight-no">Flight Number</label>
                        <input type="text" id="dep-flight-no" name="flight_no" required>
                    </div>

                    <div class="form-group">
                        <label for="dep-airline">Airline Name</label>
                        <input type="text" id="dep-airline" name="airlines" required>
                    </div>

                    <div class="form-group">
                        <label for="dep-destination">Destination City</label>
                        <input type="text" id="dep-destination" name="destination" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dep-time">Departure Time (YYYY-MM-DD HH:MM:SS)</label>
                        <input type="text" id="dep-time" name="d_time" required>
                    </div>

                    <div class="form-group">
                        <label for="dep-gate">Gate</label>
                        <input type="text" id="dep-gate" name="gate" required>
                    </div>

                    <div class="form-group">
                        <label for="dep-status">Status</label>
                        <select id="dep-status" name="status">
                            <option value="On Time">On Time</option>
                            <option value="Boarding">Boarding</option>
                            <option value="Delayed">Delayed</option>
                            <option value="Departed">Departed</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Add Departure Record</button>
            </form>
        </section>

        <section class="card">
            <h2>Departure Flights Schedule</h2>
            <table id="departures-table">
                <thead>
                    <tr>
                        <th>Flight No</th>
                        <th>Airline</th>
                        <th>Destination</th>
                        <th>Departure Time</th>
                        <th>Gate</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
